# Builds the Android Auto test app (android/) and attaches the installable file to the run.
# It runs when the Android code changes, or by hand from the Actions tab ("Run workflow").
name: Android test app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the test app
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Attach the app file
        uses: actions/upload-artifact@v4
        with:
          name: leafdash-car-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
