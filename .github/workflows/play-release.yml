# Builds the Leaf Dash Android app for Google Play: an app bundle (.aab) signed with the private upload key.
# Run it by hand from the Actions tab ("Run workflow"), from main only. Upload the bundle in the Play Console.
#
# The upload key lives only in GitHub's encrypted secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_B64    the keystore file, base64-encoded
#   UPLOAD_STORE_PASSWORD  its password
#   UPLOAD_KEY_ALIAS       the key's alias inside it
#   UPLOAD_KEY_PASSWORD    the key's password
# They're only given to this job, which uses the "play" environment: protect it in Settings → Environments
# (deployment branch: main only), so nothing else can use the key.
name: Google Play release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Put the upload key in place (temporary, deleted at the end)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "::error::The UPLOAD_KEYSTORE_B64 secret isn't set"; exit 1; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed app bundle
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :app:bundleRelease --no-daemon --stacktrace
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Attach the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: leafdash-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
